name: EMA+ADX Multi-Coin Scanner + Post-Analysis

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: emaadx-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 2   # keep runtime below ~2 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Ensure logs folder exists
        run: |
          mkdir -p logs
          echo "✅ Logs folder ensured."

      - name: Run EMA+ADX Bot (signal detection)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          API_CALL_LIMIT: ${{ secrets.API_CALL_LIMIT }}       # optional override secret
          CANDLE_LIMIT: ${{ secrets.CANDLE_LIMIT }}           # optional override secret
          RUNTIME_LIMIT_MINUTES: ${{ secrets.RUNTIME_LIMIT_MINUTES }}
        run: |
          echo "🚀 Running main.py (signal detection)..."
          python main.py

      - name: Run post-analysis (metrics update)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          API_CALL_LIMIT: ${{ secrets.API_CALL_LIMIT }}
          CANDLE_LIMIT: ${{ secrets.CANDLE_LIMIT }}
          RUNTIME_LIMIT_MINUTES: ${{ secrets.RUNTIME_LIMIT_MINUTES }}
        run: |
          echo "🔍 Running post_analysis.py (metrics update)..."
          python post_analysis.py

      - name: Commit and push results
        if: success() || failure()
        run: |
          echo "🧾 Checking for updated CSV/logs..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_journal.csv logs/ || true
          git diff --cached --quiet || (
            git commit -m "📊 Auto-update: signals + post-analysis metrics"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
            echo "✅ CSV and logs pushed successfully."
          ) || echo "🫡 No new changes to commit — skipping push."
